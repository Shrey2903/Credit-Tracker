<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atomgrid Finance · Loan Utilisation & Repayment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--surface-2:#F1F4F8;--border:#DCE2EA;--border-strong:#C3CCD8;
  --text:#152033;--muted:#5A6779;--nav:#13233B;--nav-2:#1B3050;--nav-text:#B9C6D8;--nav-active:#FFFFFF;
  --primary:#1D4F91;--primary-hover:#173F75;--primary-ink:#FFFFFF;--focus:#3B82F6;
  --green:#18794E;--green-bg:#E2F3EA;--amber:#A35F00;--amber-bg:#FDF0DA;--orange:#B94E00;--orange-bg:#FFE6D4;
  --yellow:#7D6A00;--yellow-bg:#FFF6C4;--red:#B42B23;--red-bg:#FBE4E2;--blue:#1D4F91;--blue-bg:#E3ECF8;--slate:#4B5768;--slate-bg:#E8ECF1;
  --radius:6px;--shadow:0 1px 2px rgba(19,35,59,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1622;--surface:#152131;--surface-2:#1A2839;--border:#26364B;--border-strong:#34475F;
  --text:#E4EAF2;--muted:#93A2B6;--nav:#0A121D;--nav-2:#14223A;--nav-text:#A7B5C8;--nav-active:#FFFFFF;
  --primary:#4A86D6;--primary-hover:#5B95E2;--primary-ink:#0B1420;--focus:#7AB0FF;
  --green:#4CC38A;--green-bg:#123325;--amber:#F0B44C;--amber-bg:#3A2A0F;--orange:#FF9A57;--orange-bg:#3D2312;
  --yellow:#E6CF4A;--yellow-bg:#352F0D;--red:#FF7A70;--red-bg:#3C1714;--blue:#7AAEF0;--blue-bg:#16294A;--slate:#AAB6C6;--slate-bg:#243346;
  --shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1622;--surface:#152131;--surface-2:#1A2839;--border:#26364B;--border-strong:#34475F;
  --text:#E4EAF2;--muted:#93A2B6;--nav:#0A121D;--nav-2:#14223A;--nav-text:#A7B5C8;--nav-active:#FFFFFF;
  --primary:#4A86D6;--primary-hover:#5B95E2;--primary-ink:#0B1420;--focus:#7AB0FF;
  --green:#4CC38A;--green-bg:#123325;--amber:#F0B44C;--amber-bg:#3A2A0F;--orange:#FF9A57;--orange-bg:#3D2312;
  --yellow:#E6CF4A;--yellow-bg:#352F0D;--red:#FF7A70;--red-bg:#3C1714;--blue:#7AAEF0;--blue-bg:#16294A;--slate:#AAB6C6;--slate-bg:#243346;--shadow:none;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:20px}h2{font-size:16px}h3{font-size:14px;margin:16px 0 8px}
p{margin:0 0 10px}
.app{display:flex;min-height:100vh}
.nav{position:fixed;top:0;bottom:0;left:0;width:236px;background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:30;overflow-y:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand b{display:block;color:#fff;font-size:16px;font-weight:600}
.brand span{font-size:12px;color:var(--nav-text)}
.nav ul{list-style:none;margin:0;padding:0}
.nav-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--nav-text);padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13.5px}
.nav-link:hover{background:var(--nav-2);color:#fff}
.nav-link.active{background:var(--nav-2);color:var(--nav-active);box-shadow:inset 3px 0 0 #5B95E2;font-weight:500}
.nav-foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;line-height:1.4;color:#8A9AB0;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;margin-left:236px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 24px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--surface)}
.top .grow{flex:1}
.theme-btn{white-space:nowrap}
.top label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.top select,.top input{padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);font-size:13px}
.top input{width:140px}
#menubtn{display:none}
#view{padding:20px 24px 48px;max-width:1500px}
.banner{padding:10px 14px;border-radius:var(--radius);margin:14px 24px 0;font-size:13.5px}
#view .banner{margin:0 0 14px}
.banner-demo{background:var(--orange-bg);color:var(--orange);border:1px solid color-mix(in srgb,var(--orange) 30%,transparent)}
.banner-amber{background:var(--amber-bg);color:var(--amber)}
.banner-red{background:var(--red-bg);color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--border-strong);background:var(--surface);border-radius:5px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger-ghost{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-size:inherit;text-align:left}
.linkbtn:hover{text-decoration:underline}
.icon-btn{background:none;border:0;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:4px}
.icon-btn:hover{background:var(--surface-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.card .actions:last-child,.form .actions{margin-bottom:0;margin-top:12px}
.muted{color:var(--muted)}
.strong{font-weight:600}
.t-green{color:var(--green)}.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-orange{color:var(--orange)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px;font-size:13px}
.period label{display:flex;gap:6px;align-items:center}
.period input,.toolbar input,.toolbar select{padding:6px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px 14px 18px;position:relative}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--border-strong)}
.kpi-green::before{background:var(--green)}.kpi-orange::before{background:var(--orange)}.kpi-red::before{background:var(--red)}
.kpi-label{font-size:12.5px;color:var(--muted)}
.kpi-value{font-size:24px;font-weight:600;margin:4px 0 2px;letter-spacing:-.01em}
.kpi-green .kpi-value{color:var(--green)}.kpi-orange .kpi-value{color:var(--orange)}.kpi-red .kpi-value{color:var(--red)}
.kpi-sub{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.card .tablewrap{border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--border-strong);border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl-sm td,.tbl-sm th{padding:6px 8px;font-size:12.5px}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--surface-2)}
.row-muted td{color:var(--muted)}
.cell-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.mono-id{font-feature-settings:"tnum";font-weight:500;white-space:nowrap}
.nowrap{white-space:nowrap}
.rowact{white-space:nowrap}.rowact .linkbtn{margin-right:10px;font-size:12.5px}
.pills{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.5}
.pill-green{background:var(--green-bg);color:var(--green)}.pill-amber{background:var(--amber-bg);color:var(--amber)}.pill-red{background:var(--red-bg);color:var(--red)}
.pill-orange{background:var(--orange-bg);color:var(--orange)}.pill-yellow{background:var(--yellow-bg);color:var(--yellow)}.pill-blue{background:var(--blue-bg);color:var(--blue)}.pill-slate{background:var(--slate-bg);color:var(--slate)}
.due-Overdue{color:var(--red);font-weight:500}.due-DueSoon{color:var(--orange);font-weight:500}.due-Duein30Days{color:var(--yellow)}.due-FullyRepaid{color:var(--green)}
.utilcell{min-width:160px}.utilcell .num{font-size:12px;color:var(--muted);display:block;text-align:left;margin-top:3px}
.bar{height:8px;background:var(--green-bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:4px}
.bar-amber{background:var(--amber)}.bar-red{background:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.search{flex:1 1 280px;min-width:200px;max-width:440px}
.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:12px}
.tab{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tab-n{margin-left:6px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 7px;font-size:11.5px}
.empty{color:var(--muted);margin:6px 0}
.empty-block{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius)}
.empty-block .btn{margin-top:8px}
.note{background:var(--blue-bg);color:var(--text);padding:9px 12px;border-radius:5px;font-size:13px;margin:8px 0 12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:0}
.fld>span{color:var(--muted);font-weight:500}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea{padding:7px 9px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);font-size:13.5px;width:100%}
.fld input:disabled,.fld select:disabled{background:var(--surface-2);color:var(--muted)}
.fld small{color:var(--muted);font-size:11.5px}
.fld-wide{grid-column:1/-1}
.fld-end{justify-content:flex-end}
.req{color:var(--red);font-style:normal}
.check{display:flex;gap:7px;align-items:flex-start;font-size:13px;color:var(--text);padding:5px 0}
.check input{margin-top:3px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.contents{display:contents}
.form-error{color:var(--red);background:var(--red-bg);padding:7px 10px;border-radius:5px;margin:8px 0 0;font-size:13px}
.form-warn{color:var(--amber);background:var(--amber-bg);padding:7px 10px;border-radius:5px;margin:8px 0 0;font-size:13px}
.limit-hint{font-size:13px;color:var(--muted);margin:12px 0 0}
[hidden]{display:none!important}
.settle-toggle{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2)}
.settle-toggle.on{border-color:var(--primary);background:var(--blue-bg)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;color:var(--text);user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{position:relative;flex:none;width:38px;height:22px;border-radius:999px;background:var(--border-strong);transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.track{background:var(--primary)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--focus);outline-offset:2px}
.switch input:disabled+.track{opacity:.5}.switch input:disabled~b{color:var(--muted)}
.switch b{font-weight:600}.switch small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.settle-box{grid-column:1/-1;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:10px 12px;font-size:13px}
.settle-box h4{margin:0 0 6px;font-size:13px;font-weight:600}
.settle-box table{width:100%;border-collapse:collapse}
.settle-box td{padding:4px 0;border-bottom:1px solid var(--border);vertical-align:top}
.settle-box td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.settle-box tr.this td{color:var(--primary);font-weight:500}
.settle-box tr.total td{border-bottom:0;border-top:2px solid var(--border-strong);font-weight:600;font-size:14px;padding-top:7px}
.settle-box .cell-sub{display:block}
.exception{border:1px solid var(--red);background:var(--red-bg);padding:12px;border-radius:5px;margin-top:12px}
.exception h3{margin:0 0 4px;color:var(--red)}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:8px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.modal-wide{max-width:1100px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:16px}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 8px 8px}
.confirm-msg{line-height:1.55}
.detail-head{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.summary-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px}
.summary-strip>div{padding:10px 14px;border-left:1px solid var(--border);display:flex;flex-direction:column}
.summary-strip>div:first-child{border-left:0}
.summary-strip span{font-size:12px;color:var(--muted)}.summary-strip b{font-size:16px;font-weight:600}.summary-strip small{font-size:11.5px;color:var(--muted)}
.sect{border-top:1px solid var(--border);padding:10px 0}
.sect>summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0;list-style-position:inside}
.sect>summary+*{margin-top:10px}
.sect-inline{border:1px dashed var(--border-strong);border-radius:5px;padding:8px 12px;margin-top:14px}
.sect-n{font-weight:500;color:var(--muted);font-size:12px;background:var(--surface-2);border-radius:999px;padding:1px 8px;margin-left:4px}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 18px;margin:10px 0 0}
.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:2px 0 0;word-break:break-word}
.mini-stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:10px 0 12px}
.mini-stats>div{display:flex;flex-direction:column}.mini-stats span{font-size:12px;color:var(--muted)}.mini-stats b{font-size:15px;font-weight:600}
.chip{display:inline-block;margin:4px 4px 0 0;font-size:11.5px;padding:1px 8px;border:1px solid var(--border-strong);border-radius:999px;background:var(--surface-2);cursor:pointer;color:var(--primary)}
.preview{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;display:flex;justify-content:center;padding:8px}
.preview img{max-width:100%;height:auto;max-height:70vh}
.pdfview{width:100%;height:70vh;border:0}
.changes div{font-size:12px}
.cal-title{min-width:120px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.lg{font-size:12px;padding:2px 10px;border-radius:999px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px;margin-bottom:12px}
.cal-dow{background:var(--surface-2);padding:6px 8px;font-size:12px;color:var(--muted);font-weight:600}
.cal-cell{background:var(--surface);min-height:92px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-empty{background:var(--surface-2)}
.cal-today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-day{font-size:12px;color:var(--muted);font-weight:500}
.cal-item{border:0;text-align:left;font-size:11px;padding:2px 5px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal-red{background:var(--red-bg);color:var(--red)}.cal-orange{background:var(--orange-bg);color:var(--orange)}.cal-yellow{background:var(--yellow-bg);color:var(--yellow)}.cal-blue{background:var(--blue-bg);color:var(--blue)}.cal-green{background:var(--green-bg);color:var(--green)}
.cal-red-row td:first-child{box-shadow:inset 3px 0 0 var(--red)}.cal-orange-row td:first-child{box-shadow:inset 3px 0 0 var(--orange)}.cal-yellow-row td:first-child{box-shadow:inset 3px 0 0 #D9B800}.cal-green-row td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.report-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.report-types{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.report-types legend{font-weight:600;margin-bottom:8px}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer}
.radio:has(input:checked){border-color:var(--primary);background:var(--blue-bg)}
.radio input{margin-top:3px}.radio b{display:block;font-weight:500;font-size:13px}.radio small{color:var(--muted);font-size:12px}
.report-filters{display:flex;flex-direction:column;gap:10px}
.report-filters h3{margin:0}
.fac-card .card-head{justify-content:flex-start}
.tbl-imp td[contenteditable]{min-width:90px;outline:none}
.tbl-imp td[contenteditable]:focus{background:var(--blue-bg);box-shadow:inset 0 0 0 1px var(--primary)}
.imp-err td:first-child{box-shadow:inset 3px 0 0 var(--red)}.imp-dup{opacity:.7}
.imp-res{min-width:200px}
.prose p{max-width:78ch;line-height:1.55}

.line-tab.active b{color:var(--primary)}

.line-bar span{display:block;height:100%;background:var(--primary)}
.line-bar .bar-amber{background:var(--amber)}.line-bar .bar-red{background:var(--red)}

.line-rules{max-width:90ch;margin:4px 0 0;font-size:13px}
.limitbar{height:18px;background:var(--green-bg);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.limitbar-used{height:100%;background:var(--primary)}
.limitbar-legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:13px}

<body>
<div class="app">

  <div class="main">

      <button class="btn" id="menubtn" aria-label="Open menu">Menu</button>

</div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ===== Core: money (integer paise), dates (ISO strings), calculations, validation ===== */
const Money = {
  parse(v) {
    if (v === null || v === undefined) return NaN;
    if (typeof v === 'number') return isFinite(v) ? Math.round(v * 100) : NaN;
    let s = String(v).replace(/[₹,\s]/g, '').replace(/^rs\.?/i, '');
    if (s === '') return NaN;
    if (!/^-?\d+(\.\d{1,2})?$/.test(s)) return NaN;
    const neg = s[0] === '-'; if (neg) s = s.slice(1);
    const [i, f = ''] = s.split('.');
    const p = Number(i) * 100 + Number((f + '00').slice(0, 2));
    return neg ? -p : p;
  },
  group(n) {
    const s = String(n); if (s.length <= 3) return s;
    return s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + s.slice(-3);
  },
  fmt(p, sym = true) {
    if (p === null || p === undefined || isNaN(p)) return '—';
    const neg = p < 0, a = Math.abs(Math.round(p));
    const r = Money.group(Math.floor(a / 100)) + '.' + String(a % 100).padStart(2, '0');
    return (neg ? '−' : '') + (sym ? '₹' : '') + r;
  },
  short(p) {
    if (p === null || p === undefined || isNaN(p)) return '—';
    const a = Math.abs(p), neg = p < 0 ? '−' : '';
    if (a >= 1e9) return neg + '₹' + (a / 1e9).toFixed(2) + ' Cr';
    if (a >= 1e7) return neg + '₹' + (a / 1e7).toFixed(2) + ' L';
    return Money.fmt(p);
  },
  plain(p) { return (p === null || p === undefined || isNaN(p)) ? '' : (p / 100).toFixed(2); },
  rupees(p) { return p / 100; }
};

const D = {
  iso(y, m, d) { return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; },
  today() { const n = new Date(); return D.iso(n.getFullYear(), n.getMonth() + 1, n.getDate()); },
  utc(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
  valid(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const t = new Date(D.utc(s));
    return D.iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()) === s;
  },
  add(s, n) { const t = new Date(D.utc(s) + n * 864e5); return D.iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); },
  diff(a, b) { return Math.round((D.utc(b) - D.utc(a)) / 864e5); }, // b − a in days
  fmt(s) { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}-${m}-${y}`; },
  serial(s) { return D.diff('1899-12-30', s); },
  month(s) { return s ? s.slice(0, 7) : ''; },
  monthLabel(k) { const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const [y, m] = k.split('-'); return `${M[+m - 1]}-${y}`; },
  fyStart(s) { const [y, m] = s.split('-').map(Number); return D.iso(m >= 4 ? y : y - 1, 4, 1); },
  parse(v) {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'number' && isFinite(v)) return D.add('1899-12-30', Math.floor(v));
    if (v instanceof Date && !isNaN(v)) return D.iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
    const s = String(v).trim(); let m;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return D.valid(s) ? s : null;
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) { const r = D.iso(+m[3], +m[2], +m[1]); return D.valid(r) ? r : null; }
    const MM = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
    if ((m = s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ,]+(\d{4})$/)) && MM[m[2].toLowerCase()]) {
      const r = D.iso(+m[3], MM[m[2].toLowerCase()], +m[1]); return D.valid(r) ? r : null;
    }
    if (/^\d+(\.\d+)?$/.test(s)) return D.add('1899-12-30', Math.floor(Number(s)));
    return null;
  }
};

const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
const normUTR = u => String(u || '').trim().toUpperCase();

function interestRateFor(d, fac) {
  if (d.interestRate !== undefined && d.interestRate !== null && d.interestRate !== '' && !isNaN(Number(d.interestRate))) return Number(d.interestRate);
  if (fac && fac.interestMethod === 'simple' && fac.interestRate !== '' && fac.interestRate !== null && fac.interestRate !== undefined && !isNaN(Number(fac.interestRate))) return Number(fac.interestRate);
  return null;
}

/* Simple daily interest on the declining principal balance, only when a rate is configured. */
function estimateInterest(d, fac, confirmedPrin, today) {
  const rate = interestRateFor(d, fac);
  if (rate === null || d.status !== 'Confirmed') return null;
  const basis = Number(fac && fac.dayBasis) || 365;
  const ev = confirmedPrin.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let bal = d.amount, from = d.disbursalDate, acc = 0;
  for (const e of ev) {
    if (bal <= 0) break;
    const dt = Math.max(0, D.diff(from, e.date));
    acc += bal * rate * dt / (100 * basis);
    bal -= e.amount; if (e.date > from) from = e.date;
  }
  if (bal > 0 && today > from) acc += bal * rate * D.diff(from, today) / (100 * basis);
  return Math.round(acc);
}

function computeDisb(d, fac, prins, ints, rcpts, atts, today) {
  const confP = prins.filter(p => p.status === 'Confirmed');
  const pendP = prins.filter(p => p.status === 'Pending');
  const confI = ints.filter(i => i.status === 'Confirmed');
  const active = d.status === 'Confirmed';
  const totalPaid = sum(confP, p => p.amount);
  // Principal can also come in through the Final payment recorded on the interest side (principal + interest + penalty).
  const finalPrin = sum(confI, i => Number(i.principalAmount) || 0);
  const penaltyPaid = sum(confI, i => Number(i.penalty) || 0);
  const finalRec = confI.find(i => i.paymentNo === 'final') || null;
  const settlementInterest = finalRec ? Number(finalRec.amount) || 0 : 0;
  const repaid = Math.min(totalPaid + finalPrin, d.amount);
  // Anything paid above the disbursed principal is interest: final amount paid − disbursement amount.
  const finalInterest = Math.max(0, totalPaid - d.amount);
  const outstanding = active ? d.amount - repaid : 0;
  const interestPaid = sum(confI, i => i.amount) + finalInterest;
  const latestInterestDate = confI.reduce((m, i) => (!m || i.date > m ? i.date : m), '');
  let interestPayable = null, payableSource = null;
  if (d.interestPayable !== null && d.interestPayable !== undefined && d.interestPayable !== '' && !isNaN(d.interestPayable)) { interestPayable = Number(d.interestPayable); payableSource = 'Entered'; }
  else if (finalInterest > 0 || finalRec) { interestPayable = interestPaid; payableSource = 'Final payment'; }
  else { const est = estimateInterest(d, fac, confP, today); if (est !== null) { interestPayable = est; payableSource = 'Estimated'; } }
  const remainingInterest = interestPayable === null ? null : Math.max(0, interestPayable - interestPaid);

  let principalStatus = 'Principal Outstanding';
  if (active && outstanding <= 0 && repaid > 0) principalStatus = 'Principal Fully Repaid';
  else if (repaid > 0) principalStatus = 'Partially Repaid';
  const finalRepaymentDate = principalStatus === 'Principal Fully Repaid' ? confP.concat(confI.filter(i => Number(i.principalAmount) > 0)).reduce((m, p) => (p.date > m ? p.date : m), '') : '';

  let interestStatus;
  if (d.interestSettled || finalInterest > 0 || finalRec) interestStatus = 'Interest Fully Paid';
  else if (interestPayable !== null) {
    if (interestPayable === 0 || interestPaid >= interestPayable) interestStatus = interestPaid > 0 || interestPayable === 0 ? 'Interest Fully Paid' : 'Interest Not Paid';
    else interestStatus = interestPaid > 0 ? 'Interest Partially Paid' : 'Interest Not Paid';
    // An estimate keeps accruing while principal is outstanding, so it is never "fully paid" until principal closes.
    if (payableSource === 'Estimated' && interestStatus === 'Interest Fully Paid' && principalStatus !== 'Principal Fully Repaid') interestStatus = 'Interest Partially Paid';
  } else interestStatus = interestPaid > 0 ? 'Interest Amount Pending Confirmation' : 'Interest Not Paid';

  let derivedStatus = 'Partial Paid';
  if (repaid === 0 && interestPaid === 0) derivedStatus = 'Unpaid';
  else if (principalStatus === 'Principal Fully Repaid' && interestStatus === 'Interest Fully Paid') derivedStatus = 'Paid';
  const paymentStatus = d.statusOverride && d.statusOverride.value ? d.statusOverride.value : derivedStatus;

  const dueDate = d.disbursalDate && Number.isFinite(Number(d.repaymentDays)) ? D.add(d.disbursalDate, Number(d.repaymentDays)) : '';
  const daysToDue = dueDate ? D.diff(today, dueDate) : null;
  let bucket = 'Not Yet Due';
  if (!active) bucket = d.status;
  else if (outstanding <= 0) bucket = 'Fully Repaid';
  else if (daysToDue < 0) bucket = 'Overdue';
  else if (daysToDue <= 7) bucket = 'Due Soon';
  else if (daysToDue <= 30) bucket = 'Due in 30 Days';

  const collected = sum(rcpts, r => r.amount);
  const invAmt = Number.isFinite(d.invoiceAmount) ? d.invoiceAmount : null;
  const yetToReceive = invAmt === null ? null : Math.max(0, invAmt - collected);
  let customerStatus = 'Not Received';
  if (collected > 0) customerStatus = (invAmt !== null && collected >= invAmt) ? 'Fully Received' : 'Partially Received';
  const lastReceiptDate = rcpts.reduce((m, r) => (r.date > m ? r.date : m), '');

  return {
    id: d.id, active, repaid, totalPaid, finalInterest, finalPrin, penaltyPaid, finalPaymentId: finalRec ? finalRec.id : '', settlementInterest, outstanding, pendingRepay: sum(pendP, p => p.amount),
    interestPaid, interestCount: confI.length + (finalInterest > 0 ? 1 : 0), latestInterestDate, interestPayable, payableSource, remainingInterest,
    principalStatus, interestStatus, derivedStatus, paymentStatus, overridden: !!(d.statusOverride && d.statusOverride.value),
    finalRepaymentDate, dueDate, daysToDue, bucket,
    collected, yetToReceive, customerStatus, lastReceiptDate,
    prinCount: prins.length, attCount: atts.length,
    utrs: [d.utr, ...prins.map(p => p.utr), ...ints.map(i => i.utr), ...rcpts.map(r => r.utr)].filter(Boolean).map(normUTR)
  };
}

function computeAll(data, today) {
  const facById = {}; data.facilities.forEach(f => (facById[f.id] = f));
  const group = arr => { const m = {}; (arr || []).forEach(r => { (m[r.disbursementId] = m[r.disbursementId] || []).push(r); }); return m; };
  const pBy = group(data.principal), iBy = group(data.interest), rBy = group(data.receipts), aBy = group(data.attachments);
  const disb = {};
  for (const d of data.disbursements) disb[d.id] = computeDisb(d, facById[d.facilityId], pBy[d.id] || [], iBy[d.id] || [], rBy[d.id] || [], aBy[d.id] || [], today);
  // Split each confirmed repayment into principal and interest: payments count as principal until the disbursed amount is reached; the rest is interest.
  const split = {};
  for (const d of data.disbursements) {
    let left = d.amount;
    (pBy[d.id] || []).filter(p => p.status === 'Confirmed').sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1))
      .forEach(p => { const pr = Math.max(0, Math.min(p.amount, left)); split[p.id] = { prin: pr, int: p.amount - pr }; left -= pr; });
  }
  // Interest inside a final payment shows up automatically in the interest ledger; every confirmed interest payment gets a tranche number.
  const autoInt = [];
  for (const p of data.principal || []) { const s = split[p.id]; if (s && s.int > 0) autoInt.push({ id: p.id + '-INT', srcId: p.id, auto: true, disbursementId: p.disbursementId, date: p.date, amount: s.int, mode: p.mode, utr: p.utr, utrPending: p.utrPending, bankAccount: p.bankAccount, status: 'Confirmed', remarks: 'Auto: final amount paid − disbursed amount', createdAt: p.createdAt, updatedAt: p.updatedAt }); }
  // The principal inside a Final payment also shows in the principal ledger (read-only, from the interest record).
  const autoPrin = [];
  for (const i of data.interest || []) if (Number(i.principalAmount) > 0) autoPrin.push({ id: i.id + '-PRN', srcId: i.id, auto: true, disbursementId: i.disbursementId, date: i.date, amount: Number(i.principalAmount), mode: i.mode, utr: i.utr, utrPending: i.utrPending, bankAccount: i.bankAccount, status: i.status, remarks: i.paymentNo === 'final' ? 'Auto: principal in final payment' : 'Auto: principal in interest payment ' + i.id, createdAt: i.createdAt, updatedAt: i.updatedAt });
  const tranche = {}, tBy = {};
  for (const r of (data.interest || []).concat(autoInt)) if (r.status === 'Confirmed') (tBy[r.disbursementId] = tBy[r.disbursementId] || []).push(r);
  for (const k in tBy) tBy[k].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.auto ? 1 : b.auto ? -1 : a.id < b.id ? -1 : 1).forEach((r, i) => { tranche[r.id] = i + 1; });
  const fac = {};
  for (const f of data.facilities) fac[f.id] = { id: f.id, limit: f.limit, cumulative: 0, outstanding: 0, available: 0, util: 0, due7: 0, due7Count: 0, overdue: 0, overdueCount: 0, active: 0, pendingRepay: 0, interestPaid: 0, interestOutstanding: 0, unknownInterest: 0, count: 0 };
  for (const d of data.disbursements) {
    const s = fac[d.facilityId], c = disb[d.id]; if (!s || !c.active) continue;
    s.count++; s.cumulative += d.amount; s.outstanding += c.outstanding; s.pendingRepay += c.pendingRepay; s.interestPaid += c.interestPaid;
    if (c.remainingInterest !== null) s.interestOutstanding += c.remainingInterest; else if (c.interestStatus !== 'Interest Fully Paid') s.unknownInterest++;
    if (c.outstanding > 0) {
      s.active++;
      if (c.daysToDue < 0) { s.overdue += c.outstanding; s.overdueCount++; }
      else if (c.daysToDue <= 7) { s.due7 += c.outstanding; s.due7Count++; }
    }
  }
  const totals = { limit: 0, cumulative: 0, outstanding: 0, available: 0, due7: 0, due7Count: 0, overdue: 0, overdueCount: 0, active: 0, pendingRepay: 0, interestPaid: 0, interestOutstanding: 0, unknownInterest: 0, count: 0 };
  for (const id in fac) {
    const s = fac[id];
    s.available = s.limit - s.outstanding;
    s.util = s.limit > 0 ? (s.outstanding / s.limit) * 100 : 0;
    for (const k in totals) totals[k] += s[k];
  }
  totals.util = totals.limit > 0 ? (totals.outstanding / totals.limit) * 100 : 0;
  return { disb, fac, totals, facById, split, autoInt, autoPrin, tranche };
}

function findDuplicateUTR(utr, data, excludeId) {
  const u = normUTR(utr); if (!u) return [];
  const hits = [];
  for (const store of ['principal', 'interest', 'receipts']) for (const r of data[store] || []) if (r.id !== excludeId && normUTR(r.utr) === u) hits.push(r.id);
  for (const d of data.disbursements) if (d.id !== excludeId && normUTR(d.utr) === u) hits.push(d.id);
  return hits;
}

/* Returns {errors, warnings, overLimit:{available, excess}|null} */
function validateDisbursement(r, data, calc, editingId) {
  const errors = [], warnings = [];
  const fac = calc.facById[r.facilityId];
  if (!fac) errors.push('Select a loan facility.');
  if (!r.partyName || !r.partyName.trim()) errors.push(`Enter the ${fac && fac.partyType === 'customer' ? 'customer' : 'supplier'} name.`);
  if (!D.valid(r.disbursalDate)) errors.push('Enter a valid disbursal date.');
  if (!Number.isFinite(r.amount) || r.amount <= 0) errors.push('Enter a disbursed amount greater than zero.');
  if (!Number.isInteger(r.repaymentDays) || r.repaymentDays < 0 || r.repaymentDays > 3650) errors.push('Repayment period must be a whole number of days between 0 and 3650.');
  if (r.invoiceDate && !D.valid(r.invoiceDate)) errors.push('Invoice date is not a valid date.');
  if (r.invoiceAmount !== null && r.invoiceAmount !== undefined && (!Number.isFinite(r.invoiceAmount) || r.invoiceAmount < 0)) errors.push('Invoice amount is not a valid amount.');
  if (r.interestPayable !== null && r.interestPayable !== undefined && (!Number.isFinite(r.interestPayable) || r.interestPayable < 0)) errors.push('Interest payable is not a valid amount.');
  if (r.expectedCustomerDate && !D.valid(r.expectedCustomerDate)) errors.push('Expected customer payment date is not a valid date.');
  if (fac && fac.partyType === 'supplier' && fac.requirePoInvoice && !(r.poNumber || '').trim() && !(r.invoiceNumber || '').trim()) errors.push(`${fac.name} disbursements must reference a PO or invoice number.`);
  if (fac && fac.partyType === 'customer' && !(r.invoiceNumber || '').trim()) errors.push('Enter the customer invoice number.');
  if (!['Confirmed', 'Pending', 'Cancelled'].includes(r.status)) errors.push('Select a disbursement status.');
  let overLimit = null;
  if (fac && editingId) {
    const c = calc.disb[editingId];
    if (c && Number.isFinite(r.amount) && r.amount < c.repaid + c.pendingRepay) errors.push(`Amount cannot be less than principal already repaid or pending (${Money.fmt(c.repaid + c.pendingRepay)}).`);
    if (c && r.status !== 'Confirmed' && (c.repaid > 0 || c.pendingRepay > 0)) errors.push('This disbursement has repayments recorded, so it must stay Confirmed.');
  }
  if (fac && r.status === 'Confirmed' && Number.isFinite(r.amount) && errors.length === 0) {
    const s = calc.fac[fac.id];
    const prev = editingId && calc.disb[editingId] && calc.disb[editingId].active ? calc.disb[editingId] : null;
    const othersOutstanding = s.outstanding - (prev ? prev.outstanding : 0);
    const thisOutstanding = r.amount - (prev ? prev.repaid : 0);
    const available = fac.limit - othersOutstanding;
    if (thisOutstanding > available) overLimit = { available, excess: thisOutstanding - available };
  }
  if (r.utr) { const dup = findDuplicateUTR(r.utr, data, editingId); if (dup.length) warnings.push(`Reference ${r.utr} is already used on ${dup.join(', ')}.`); }
  return { errors, warnings, overLimit };
}

function validatePrincipal(r, data, calc, editingId) {
  const errors = [], warnings = [];
  const d = data.disbursements.find(x => x.id === r.disbursementId);
  const fac = d && calc.facById[d.facilityId];
  if (!d) errors.push('Select a disbursement.');
  else if (d.status !== 'Confirmed') errors.push('Repayments can only be recorded against a confirmed disbursement.');
  if (!D.valid(r.date)) errors.push('Enter a valid repayment date.');
  else if (d && r.date < d.disbursalDate) errors.push('Repayment date cannot be before the disbursal date.');
  if (!Number.isFinite(r.amount) || r.amount <= 0) errors.push('Enter a principal amount greater than zero.');
  if (!['Pending', 'Confirmed', 'Failed', 'Reversed'].includes(r.status)) errors.push('Select a payment status.');
  if (!['NACH/Auto Debit', 'Manual'].includes(r.mode)) errors.push('Select a payment mode.');
  if (fac && r.mode === 'NACH/Auto Debit' && !fac.nachEnabled) errors.push(`${fac.name} is not set up for NACH. Choose Manual, or enable NACH in Facility settings.`);
  if (fac && r.status === 'Confirmed' && r.mode === 'Manual' && fac.utrRequiredManual && !(r.utr || '').trim() && !r.utrPending)
    errors.push("Enter the UTR for this manual payment, or tick 'Bank has not generated a UTR yet'.");
  if (d && Number.isFinite(r.amount) && (r.status === 'Confirmed' || r.status === 'Pending')) {
    const others = sum(data.principal.filter(p => p.disbursementId === d.id && p.id !== editingId && (p.status === 'Confirmed' || p.status === 'Pending')), p => p.amount);
    if (others + r.amount > d.amount) warnings.push(`Total paid will be ${Money.fmt(others + r.amount)} against ${Money.fmt(d.amount)} disbursed. The extra ${Money.fmt(others + r.amount - d.amount)} will be counted as interest paid (final amount − disbursement amount), and interest will be marked fully paid.`);
  }
  if (r.utr) { const dup = findDuplicateUTR(r.utr, data, editingId); if (dup.length) warnings.push(`UTR ${r.utr} is already used on ${dup.join(', ')}.`); }
  return { errors, warnings };
}

function validateInterest(r, data, calc, editingId) {
  const errors = [], warnings = [];
  const d = data.disbursements.find(x => x.id === r.disbursementId);
  const fac = d && calc.facById[d.facilityId];
  if (!d) errors.push('Select a disbursement.');
  if (!D.valid(r.date)) errors.push('Enter a valid payment date.');
  const pen = r.penalty === undefined || r.penalty === null ? 0 : r.penalty;
  if (!Number.isFinite(pen) || pen < 0) errors.push('Penalty must be blank or an amount of zero or more.');
  const others = d ? data.interest.filter(i => i.disbursementId === d.id && i.id !== editingId && i.status !== 'Reversed') : [];
  const fin = others.find(i => i.paymentNo === 'final');
  if (r.paymentNo === 'final') {
    if (d && d.status !== 'Confirmed') errors.push('A final payment can only be recorded against a confirmed disbursement.');
    if (!Number.isFinite(r.totalPaid) || r.totalPaid <= 0) errors.push('Enter the amount paid in the final payment / settlement.');
    else if (!(r.amount >= 0) && !(Number(r.principalAmount) > 0)) errors.push('The interest amount cannot be negative.');
    else if (!(r.amount >= 0)) errors.push(`The total paid (${Money.fmt(r.totalPaid)}) is less than the outstanding principal (${Money.fmt(r.principalAmount)})${pen ? ' plus the penalty' : ''}. Check the amount.`);
    if (fin) errors.push(`A final payment / settlement is already recorded for ${d.id} (${fin.id}). Edit that one instead.`);
  } else {
    if (!Number.isFinite(r.amount) || r.amount < 0 || (r.amount === 0 && !(pen > 0))) errors.push('Enter an interest amount greater than zero (or a penalty).');
    if (fin) warnings.push(`The final payment (${fin.id}) is already recorded for ${d.id}. This will be an extra payment after closure.`);
    const dup = Number(r.paymentNo) > 0 && others.find(i => Number(i.paymentNo) === Number(r.paymentNo));
    if (dup) warnings.push(`The ${ordinal(Number(r.paymentNo))} interest payment is already recorded as ${dup.id}.`);
  }
  if (!['Confirmed', 'Pending', 'Reversed'].includes(r.status)) errors.push('Select a payment status.');
  const auto = ['NACH/Auto Debit', 'Deducted by lender'].includes(r.mode);
  if (fac && r.status === 'Confirmed' && !auto && fac.utrRequiredManual && !(r.utr || '').trim() && !r.utrPending)
    errors.push("Enter the UTR for this payment, or tick 'Bank has not generated a UTR yet'.");
  if (r.utr) { const dup = findDuplicateUTR(r.utr, data, editingId); if (dup.length) warnings.push(`UTR ${r.utr} is already used on ${dup.join(', ')}.`); }
  return { errors, warnings };
}

function validateReceipt(r, data, calc, editingId) {
  const errors = [], warnings = [];
  const d = data.disbursements.find(x => x.id === r.disbursementId);
  const fac = d && calc.facById[d.facilityId];
  if (!d) errors.push('Select a disbursement.');
  else if (!fac || !fac.collections) errors.push('Customer receipts apply only to SID facilities.');
  if (!D.valid(r.date)) errors.push('Enter a valid receipt date.');
  if (!Number.isFinite(r.amount) || r.amount <= 0) errors.push('Enter an amount greater than zero.');
  if (d && Number.isFinite(d.invoiceAmount) && Number.isFinite(r.amount)) {
    const others = sum((data.receipts || []).filter(x => x.disbursementId === d.id && x.id !== editingId), x => x.amount);
    if (others + r.amount > d.invoiceAmount) warnings.push(`Total collections will exceed the customer invoice amount (${Money.fmt(d.invoiceAmount)}).`);
  }
  if (r.utr) { const dup = findDuplicateUTR(r.utr, data, editingId); if (dup.length) warnings.push(`UTR ${r.utr} is already used on ${dup.join(', ')}.`); }
  return { errors, warnings };
}

const TABS = [['all', 'All disbursements'], ['active', 'Active / outstanding'], ['due7', 'Due in 7 days'], ['due30', 'Due in 30 days'], ['overdue', 'Overdue'], ['partial', 'Principal partially repaid'], ['repaid', 'Principal fully repaid'], ['intpartial', 'Interest partially paid'], ['settled', 'Fully settled']];
function tabMatch(tab, c) {
  switch (tab) {
    case 'active': return c.active && c.outstanding > 0;
    case 'due7': return c.active && c.outstanding > 0 && c.daysToDue >= 0 && c.daysToDue <= 7;
    case 'due30': return c.active && c.outstanding > 0 && c.daysToDue >= 0 && c.daysToDue <= 30;
    case 'overdue': return c.active && c.outstanding > 0 && c.daysToDue < 0;
    case 'partial': return c.principalStatus === 'Partially Repaid';
    case 'repaid': return c.principalStatus === 'Principal Fully Repaid';
    case 'intpartial': return c.interestStatus === 'Interest Partially Paid';
    case 'settled': return c.paymentStatus === 'Paid';
    default: return true;
  }
}
function filterDisb({ f = {}, tab = 'all', q = '' } = {}) {
  const ql = q.trim().toLowerCase(), qu = q.trim().toUpperCase();
  const inR = (v, a, b) => (!a || (v && v >= a)) && (!b || (v && v <= b));
  const like = (v, s) => !s || String(v || '').toLowerCase().includes(s.toLowerCase());
  return S.data.disbursements.filter(d => {
    const c = S.calc.disb[d.id], F = fac(d.facilityId);
    if (!tabMatch(tab, c)) return false;
    if (S.line && d.facilityId !== S.line) return false;
    if (f.facility && d.facilityId !== f.facility) return false;
    if (f.supplier && !(F.partyType === 'supplier' && like(d.partyName, f.supplier))) return false;
    if (f.customer && !(F.partyType === 'customer' && like(d.partyName, f.customer))) return false;
    if (f.party && !like(d.partyName, f.party)) return false;
    if (!like(d.poNumber, f.po) || !like(d.invoiceNumber, f.invoice) || !like(d.id, f.id)) return false;
    if (!inR(d.disbursalDate, f.dFrom, f.dTo) || !inR(c.dueDate, f.uFrom, f.uTo) || !inR(c.finalRepaymentDate, f.aFrom, f.aTo)) return false;
    if (f.payStatus && c.paymentStatus !== f.payStatus) return false;
    if (f.prinStatus && c.principalStatus !== f.prinStatus) return false;
    if (f.intStatus && c.interestStatus !== f.intStatus) return false;
    if (f.method && d.repaymentMethod !== f.method) return false;
    if (f.bucket && c.bucket !== f.bucket) return false;
    if (ql && !(d.id.toLowerCase().includes(ql) || like(d.partyName, ql) || like(d.invoiceNumber, ql) || like(d.poNumber, ql) || c.utrs.some(u => u.includes(qu)))) return false;
    return true;
  });
}
function sortDisb(list, key, dir) {

  return list.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : a.id < b.id ? -1 : 1) * dir; });
}

  const attention = ds.map(d => S.calc.disb[d.id]).filter(c => c.active && c.outstanding > 0 && c.daysToDue <= 30).sort((a, b) => a.daysToDue - b.daysToDue);

function filterLedger(key) {

    const d = disbById(p.disbursementId); if (!d) return false;
    if (L.facility && d.facilityId !== L.facility) return false;
    if (!inLine(d.facilityId)) return false;
    if (L.status && p.status !== L.status) return false;
    if (L.mode && p.mode !== L.mode) return false;
    if (L.from && p.date < L.from) return false; if (L.to && p.date > L.to) return false;
    if (q && ![p.id, p.disbursementId, p.utr, d.partyName, d.invoiceNumber].some(v => String(v || '').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : a.id < b.id ? 1 : -1);
}

/* ===== Calendar ===== */
function viewCalendar() {
  const [y, m] = S.cal.month.split('-').map(Number);
  const first = D.iso(y, m, 1), startDow = (new Date(D.utc(first)).getUTCDay() + 6) % 7, days = D.diff(first, D.iso(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1));
  const byDay = {};
  S.data.disbursements.forEach(d => { const c = S.calc.disb[d.id]; if (c.active && c.dueDate && inLine(d.facilityId)) (byDay[c.dueDate] = byDay[c.dueDate] || []).push({ d, c }); });
  const cls = c => c.outstanding <= 0 ? 'cal-green' : c.daysToDue < 0 ? 'cal-red' : c.daysToDue <= 7 ? 'cal-orange' : c.daysToDue <= 30 ? 'cal-yellow' : 'cal-blue';
  let cells = ''; for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for (let i = 1; i <= days; i++) {
    const iso = D.iso(y, m, i), items = byDay[iso] || [];
    cells += `<div class="cal-cell ${iso === S.today ? 'cal-today' : ''}"><div class="cal-day">${i}</div>${items.slice(0, 3).map(({ d, c }) => `<button class="cal-item ${cls(c)}" data-act="view-disb" data-id="${d.id}" title="${esc(d.partyName)}">${Money.short(c.outstanding > 0 ? c.outstanding : d.amount)} · ${esc(fac(d.facilityId).code)}</button>`).join('')}${items.length > 3 ? `<span class="cell-sub">+${items.length - 3} more</span>` : ''}</div>`;
  }
  const upcoming = Object.values(S.calc.disb).filter(c => c.active && c.outstanding > 0 && inLine(disbById(c.id).facilityId)).sort((a, b) => a.daysToDue - b.daysToDue);
  const recent = Object.values(S.calc.disb).filter(c => inLine(disbById(c.id).facilityId) && c.active && c.outstanding <= 0 && c.finalRepaymentDate >= D.add(S.today, -30)).sort((a, b) => a.finalRepaymentDate < b.finalRepaymentDate ? 1 : -1);
  const notif = typeof Notification !== 'undefined' ? Notification.permission : 'unsupported';
  return `<div class="toolbar"><button class="btn" data-act="cal-prev" aria-label="Previous month">Previous</button><h2 class="cal-title">${D.monthLabel(S.cal.month)}</h2><button class="btn" data-act="cal-next" aria-label="Next month">Next</button><button class="btn" data-act="cal-today">This month</button><span class="grow"></span>
    ${notif === 'unsupported' ? '<span class="muted">Browser reminders are not supported here.</span>' : notif === 'granted' && LS.get('agl.notify', false) ? `<span class="pill pill-green">Browser reminders on</span><button class="btn" data-act="notify-off">Turn off</button>` : `<button class="btn" data-act="notify-on">Turn on browser reminders</button>`}</div>
  <div class="legend"><span class="lg cal-red">Overdue</span><span class="lg cal-orange">Due within 7 days</span><span class="lg cal-yellow">Due in 8–30 days</span><span class="lg cal-blue">Later</span><span class="lg cal-green">Fully repaid</span></div>
  <div class="cal" role="grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  <p class="note">Reminders are alerts only; they never record or confirm a payment. Email reminders need a server backend and are not part of this local version.</p>
  <section class="card"><div class="card-head"><h2>Outstanding principal by due date</h2></div>
  ${upcoming.length ? `<div class="tablewrap"><table class="tbl"><thead><tr><th>Due date</th><th>Days</th><th>Disbursement</th><th>Facility</th><th>Party</th><th class="num">Outstanding</th><th>Method</th></tr></thead><tbody>
  ${upcoming.map(c => { const d = disbById(c.id); return `<tr class="clickrow ${cls(c)}-row" data-act="view-disb" data-id="${c.id}"><td>${D.fmt(c.dueDate)}</td><td><span class="pill pill-${c.daysToDue < 0 ? 'red' : c.daysToDue <= 7 ? 'orange' : c.daysToDue <= 30 ? 'yellow' : 'blue'}">${dueText(c)}</span></td><td class="mono-id">${c.id}</td><td>${esc(fac(d.facilityId).name)}</td><td>${esc(d.partyName)}</td><td class="num">${Money.fmt(c.outstanding)}</td><td>${esc(d.repaymentMethod || '')}</td></tr>`; }).join('')}</tbody></table></div>` : `<p class="empty">No outstanding principal.</p>`}</section>
  ${recent.length ? `<section class="card"><div class="card-head"><h2>Fully repaid in the last 30 days</h2></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Repaid on</th><th>Disbursement</th><th>Facility</th><th>Party</th><th class="num">Principal</th></tr></thead><tbody>${recent.map(c => { const d = disbById(c.id); return `<tr class="clickrow cal-green-row" data-act="view-disb" data-id="${c.id}"><td>${D.fmt(c.finalRepaymentDate)}</td><td class="mono-id">${c.id}</td><td>${esc(fac(d.facilityId).name)}</td><td>${esc(d.partyName)}</td><td class="num">${Money.fmt(d.amount)}</td></tr>`; }).join('')}</tbody></table></div></section>` : ''}`;
}
function runReminders() {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted' || !LS.get('agl.notify', false)) return;
    if (LS.get('agl.notified', '') === S.today) return;
    const T = S.calc.totals; if (!T.overdueCount && !T.due7Count) return;
    new Notification('Atomgrid loan repayments', { body: `${T.overdueCount} overdue (${Money.short(T.overdue)}), ${T.due7Count} due in 7 days (${Money.short(T.due7)}). Reminder only — no payment recorded.` });
    LS.set('agl.notified', S.today);
  } catch (e) {}
}

function buildSheet(cols, rows, { totals = true } = {}) {
  const enc = XLSX.utils.encode_cell, ws = {}, R = rows.length;
  cols.forEach((c, ci) => ws[enc({ r: 0, c: ci })] = { t: 's', v: c.h });
  rows.forEach((row, ri) => cols.forEach((c, ci) => {
    let v; try { v = c.v(row); } catch (e) { v = ''; }
    if (v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v))) return;

async function saveFacility(id) {
  const f = S.data.facilities.find(x => x.id === id), form = $(`[data-facform="${id}"]`);

  if (!Number.isInteger(days) || days < 0 || days > 3650) errs.push('Default period must be a whole number of days.');
  if (rate !== '' && (isNaN(Number(rate)) || Number(rate) < 0 || Number(rate) > 100)) errs.push('Interest rate must be between 0 and 100.');
  if (form.elements.interestMethod.value === 'simple' && rate === '') errs.push('Enter an interest rate to use simple daily calculation.');
  if (!form.elements.nachEnabled.checked && form.elements.defaultMethod.value === 'NACH/Auto Debit') errs.push('Default method cannot be NACH when NACH is disabled.');
  if (errs.length) return toast(errs.join(' '), 'err');
  const rec = Object.assign({}, f, { limit, defaultDays: days, defaultMethod: form.elements.defaultMethod.value, partyType: form.elements.partyType.value, nachEnabled: form.elements.nachEnabled.checked, utrRequiredManual: form.elements.utrRequiredManual.checked, requirePoInvoice: form.elements.requirePoInvoice.checked, collections: form.elements.collections.checked, escrow: form.elements.escrow.checked, interestMethod: form.elements.interestMethod.value, interestRate: rate === '' ? '' : Number(rate), dayBasis: Number(form.elements.dayBasis.value), interestFrequency: form.elements.interestFrequency.value, notes: form.elements.notes.value.trim(), limitHistory: (f.limitHistory || []).slice() });
  let reason = '';
  if (limit !== f.limit) {
    const s = S.calc.fac[id];
    const r = await confirmBox(`Change the ${esc(f.name)} sanctioned limit from <b>${Money.fmt(f.limit)}</b> to <b>${Money.fmt(limit)}</b>?${limit < s.outstanding ? `<br><br><span class="t-red">The new limit is below current outstanding principal (${Money.fmt(s.outstanding)}). Available credit will be negative.</span>` : ''}`, { title: 'Change sanctioned limit', okText: 'Change limit', reason: true });
    if (!r.ok) return; reason = r.reason;
    rec.limitHistory.push({ at: nowTs(), from: f.limit, to: limit, by: S.user, reason });
  }
  if (rec.nachEnabled !== f.nachEnabled && !rec.nachEnabled && S.data.disbursements.some(d => d.facilityId === id && d.repaymentMethod === 'NACH/Auto Debit')) toast('Existing NACH disbursements keep their method; new NACH repayments will be blocked.', 'err');
  let updateExisting = false;
  if (days !== f.defaultDays) {
    const affected = S.data.disbursements.filter(d => d.facilityId === id && d.repaymentDays === f.defaultDays && S.calc.disb[d.id].outstanding > 0);
    if (affected.length) { const r = await confirmBox(`The new default of ${days} days applies to future disbursements.<br><br>${affected.length} outstanding disbursement${affected.length === 1 ? ' uses' : 's use'} the old default of ${f.defaultDays} days. Update ${affected.length === 1 ? 'it' : 'them'} too? Actual repayment dates are never changed.`, { title: 'Apply to existing disbursements?', okText: `Also update ${affected.length}` }); updateExisting = r.ok; }

  toast(`${f.name} settings saved`); render();
}

async function readImportFile(file, csvType) {
  const buf = file.arrayBuffer ? await file.arrayBuffer() : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(file); });
  const isCSV = /\.csv$/i.test(file.name);
  const wb = XLSX.read(buf, { type: 'array', raw: isCSV, cellDates: false });
  const sheets = {};
  IMP_ORDER.forEach(k => { const n = wb.SheetNames.find(s => normH(s) === normH(IMPORT_DEF[k].sheet)); if (n) sheets[k] = wb.Sheets[n]; });
  if (!Object.keys(sheets).length) { const first = wb.SheetNames.find(n => !/instructions|examples/i.test(n)); if (first) sheets[csvType] = wb.Sheets[first]; }
  const out = { fileName: file.name, sheets: {}, sheetErrors: [] };
  for (const k of IMP_ORDER) {
    if (!sheets[k]) continue;
    const aoa = XLSX.utils.sheet_to_json(sheets[k], { header: 1, raw: true, defval: '' });
    if (!aoa.length) continue;
    const head = aoa[0].map(normH), def = IMPORT_DEF[k];
    const map = def.cols.map(c => head.indexOf(normH(c[0])));
    const missing = def.cols.filter((c, i) => c[3] && map[i] < 0).map(c => c[0]);
    const unknown = aoa[0].filter(h => h !== '' && !def.cols.some(c => normH(c[0]) === normH(h)));
    if (missing.length) out.sheetErrors.push(`${def.sheet}: missing required column${missing.length > 1 ? 's' : ''} ${missing.join(', ')}.`);
    if (unknown.length) out.sheetErrors.push(`${def.sheet}: ignored unknown column${unknown.length > 1 ? 's' : ''} ${unknown.join(', ')}.`);
    if (missing.length) continue;
    const rows = aoa.slice(1).filter(r => r.some(v => String(v).trim() !== '')).map(r => def.cols.map((c, i) => {
      const v = map[i] < 0 ? '' : r[map[i]];
      if (typeof v === 'number' && c[2] === 'd') return D.fmt(D.parse(v));
      return String(v === null || v === undefined ? '' : v).trim();
    }));
    out.sheets[k] = { rows, results: [] };
  }
  return out;
}

      if (raw === '') { rec[key] = t === 'm' ? null : t === 'b' ? false : ''; return; }
      if (t === 'd') { const d = D.parse(raw); if (!d) errs.push(`${h} "${raw}" is not a valid date.`); else rec[key] = d; }
      else if (t === 'm') { const p = Money.parse(raw); if (isNaN(p)) errs.push(`${h} "${raw}" is not a valid amount.`); else rec[key] = p; }
      else if (t === 'i') { const n = Number(raw); if (!Number.isInteger(n)) errs.push(`${h} must be a whole number.`); else rec[key] = n; }

  let j; try { j = JSON.parse(file.text ? await file.text() : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); })); } catch (e) { return toast('That file is not a valid backup (could not read JSON).', 'err'); }
  if (!j || j.app !== 'atomgrid-loan-tracker' || !j.stores || !Array.isArray(j.stores.disbursements)) return toast('That file is not an Atomgrid loan tracker backup.', 'err');
  const n = j.stores.disbursements.length;
  const r = await confirmBox(`This replaces <b>all ${S.mode} data</b> in this browser (${S.data.disbursements.length} disbursements now) with the backup from ${fmtTs(j.exportedAt)} (${n} disbursements, ${(j.files || []).length} files). Download a backup of the current data first if you might need it.`, { title: 'Restore backup', okText: 'Replace and restore', danger: true, requireText: 'RESTORE' });
  if (!r.ok) return;
  await DB.clear(STORES);
  const map = {}; DATA_STORES.forEach(s => map[s] = Array.isArray(j.stores[s]) ? j.stores[s] : []);
  map.files = (j.files || []).map(f => ({ id: f.id, blob: b64ToBlob(f.data, f.mime) }));
  map.meta = [{ key: 'counters', value: j.counters || {} }];
  await DB.putMany(map); await loadAll();
  SharedState.lastPush = '';
  await audit('system', 'RESTORE', 'restore', [], `Restored backup exported ${fmtTs(j.exportedAt)}`);
  toast('Backup restored'); render();
}
